<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Publicación</title>
</head>
<body>
    <h2>¿Estás seguro de que deseas eliminar "{{ post.titulo }}"?</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>
    <br>
    <a href="{% url 'detalle_post' post.pk %}">Cancelar</a>
</body>
</html>
