<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ post.titulo }}</title>
</head>
<body>
    <a href="{% url 'lista_posts' %}">← Volver al inicio</a>
    <hr>
    <h1>{{ post.titulo }}</h1>
    <small>Publicado el: {{ post.fecha }} por {{ post.autor }}</small>
    
    {% if post.imagen %}
        <div>
            <br>
            <img src="{{ post.imagen.url }}" alt="{{ post.titulo }}" width="400">
        </div>
    {% endif %}

    <hr>
    <p>{{ post.contenido }}</p>
</body>
</html>
